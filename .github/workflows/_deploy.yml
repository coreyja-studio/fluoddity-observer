name: Deploy

on:
  workflow_call:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Queue production deploys rather than cancelling them. `cancel-in-progress:
    # true` kills a run whose `flyctl deploy` is already in flight, abandoning a
    # release halfway for no gain. Queueing still ends on the newest SHA:
    # GitHub drops the older *pending* entry when a newer run queues behind a
    # running one.
    concurrency:
      group: deploy-fluoddity-observer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: flyctl deploy --remote-only --build-arg PCG_GIT_SHA=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
